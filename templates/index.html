{% extends 'base.html' %}
{% load static %}

{% block title %}Home{% endblock %}
{% block content %}    
     <!-- ##### Best Receipe Area Start ##### -->
     <section class="best-receipe-area">
        <div class="container">
            <div class="row">
                {% for prato in lista_pratos %}
                <!-- Single Best Receipe Area -->
                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="single-best-receipe-area mb-30">
                        {% if prato.foto_prato == None or prato.foto_prato == '' %}
                        <img src="{% static 'img/bg-img/foto_receita.png' %}" alt="">
                        {% else %}
                            <img src="{{ prato.foto_prato.url }}" alt="">
                        {% endif %}
                        <div class="receipe-content">
                            <a href="{% url 'churras:churrasco' prato.id %}">
                                <h5>{{ prato.nome_prato }}</h5>
                            </a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
    <!-- ##### Best Receipe Area End ##### -->
{% endblock %}
